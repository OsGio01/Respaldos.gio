name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bateria:
    # Solo Windows: las pruebas abren ventanas de Tk y el ejecutable es de Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil cryptography

      - name: Bateria de pruebas
        run: python Pruebas/run_all_tests.py
